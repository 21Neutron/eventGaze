# In-memory H2 configuration for tests so test execution doesn't depend on live external services
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Mock/dummy AWS configs for tests
AWS.ACCESS.KEY.ID=test-access-key
AWS.SECRET.ACCESS.KEY=test-secret-key
AWS.REGION=us-east-1

# JWT Secret
JWT.SECRET.KEY=testjwtsecretkeywithsufficientlengthforvalidation1234567890
