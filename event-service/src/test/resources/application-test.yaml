spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

AWS:
  ACCESS:
    KEY:
      ID: test-access-key
  SECRET:
    ACCESS:
      KEY: test-secret-key
  REGION: us-east-1
  S3:
    BUCKET_NAME: test-eventgaze-bucket

storage:
  base-url: ${STORAGE_BASE_URL:https://eventgazeeventimages.s3.amazonaws.com/}

JWT:
  SECRET:
    KEY: testjwtsecretkeywithsufficientlengthforvalidation1234567890
jwt:
  expiration:
    ms: 86400000
